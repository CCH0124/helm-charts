apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namePrefix: stage-
commonLabels:
 env: stage
commonAnnotations:
  team: "team-c"
namespace: team-c

bases:
- ../../../base

patches:
- target:
    kind: Namespace
    name: dev
  patch: |-
    - op: replace
      path: /metadata/name
      value: team-c
- target:
    kind: ResourceQuota
    name: resource-quota
  patch: |-
    - op: replace
      path: /metadata/name
      value: quota-team-c
- target:
    kind: LimitRange
    name: limit-range
  patch: |-
    - op: replace
      path: /metadata/name
      value: limit-team-c
    - op: replace
      path: /spec/limits/0/defaultRequest/cpu
      value: 100m
