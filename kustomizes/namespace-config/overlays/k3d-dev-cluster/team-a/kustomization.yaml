apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namePrefix: dev-
commonLabels:
 env: dev
commonAnnotations:
  team: "team-c"
namespace: team-c

bases:
- ../../../base

patches:
- target:
    kind: Namespace
    name: dev
  patch: |-
    - op: replace
      path: /metadata/name
      value: team-c
- target:
    kind: ResourceQuota
    name: resource-quota
  patch: |-
    - op: replace
      path: /metadata/name
      value: quota-team-c
    - op: replace
      path: /spec/hard/limits.cpu
      value: 1 
    - op: replace
      path: /spec/hard/pods
      value: 10 
- target:
    kind: LimitRange
    name: limit-range
  patch: |-
    - op: replace
      path: /metadata/name
      value: limit-team-c
